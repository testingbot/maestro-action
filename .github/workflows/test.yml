name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dry-run:
    name: dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Exercise the CLI from source so the action can be tested against
      # flags that are merged but not yet published to npm. Users get the
      # published @testingbot/cli via npx (see cli-version).
      - uses: actions/checkout@v4
        with:
          repository: testingbot/testingbotctl
          ref: main
          path: .cli
      - name: Build @testingbot/cli from source
        shell: bash
        run: cd .cli && npm ci && npm run build
      - name: Run the action in dry-run mode
        id: maestro
        uses: ./
        env:
          TESTINGBOT_CLI_COMMAND: node ${{ github.workspace }}/.cli/dist/index.js
        with:
          api-key: dry-run
          api-secret: dry-run
          app-binary-id: 1
          platform: iOS
          workspace: .github/fixtures/flows
          include-tags: smoke
          env: |
            USERNAME=demo
            PASSWORD=secret
          metadata: |
            team=mobile
          device-matrix: |
            iPhone 16:18
            iPhone 15:17
          dry-run: true
      - name: Check outputs
        shell: bash
        run: |
          test "${{ steps.maestro.outputs.outcome }}" = "dry-run"
          test -f "${{ steps.maestro.outputs.results-file }}"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/run.sh
